<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B2340" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Google Indexing & Crawling -->
    <title>Master Diamond | Digital Solutions & Technology Services</title>
    <meta name="description" content="Master Diamond delivers enterprise digital solutions, bespoke web development, mobile applications, custom software, IoT telemetry, AI automation, and cloud engineering." />
    <meta name="keywords" content="Master Diamond, software development company, web development, mobile app development, custom software, IoT solutions, AI machine learning, Pune India, IT consulting" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://masterdiamond.in/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Master Diamond" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://masterdiamond.in/" />
    <meta property="og:title" content="Master Diamond | Digital Solutions & Technology Services" />
    <meta property="og:description" content="Enterprise digital transformation, web applications, mobile apps, AI automation, and IoT platforms built from Pune, India." />
    <meta property="og:image" content="https://masterdiamond.in/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Master Diamond | Digital Solutions & Technology Services" />
    <meta name="twitter:description" content="Enterprise digital transformation, web applications, mobile apps, AI automation, and IoT platforms built from Pune, India." />
    <meta name="twitter:image" content="https://masterdiamond.in/logo.png" />

    <!-- Preconnect for Performance & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://masterdiamond.in/#organization",
          "name": "Master Diamond",
          "url": "https://masterdiamond.in/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://masterdiamond.in/logo.png"
          },
          "description": "Enterprise software development, bespoke web development, mobile apps, AI & IoT engineering solutions based in Pune, Maharashtra, India.",
          "telephone": "+917219697621",
          "email": "info@masterdiamond.in",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Pune",
            "addressRegion": "Maharashtra",
            "addressCountry": "IN"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://masterdiamond.in/#website",
          "url": "https://masterdiamond.in/",
          "name": "Master Diamond",
          "publisher": {
            "@id": "https://masterdiamond.in/#organization"
          }
        }
      ]
    }
    </script>
  </head>
